[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-briefing"
version = "0.1.0"
description = "Registratore di briefing per Raspberry Pi con caricamento su NotebookLM, controllabile da terminale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Riccardo Sacchetto" }]
dependencies = [
  # Libreria NON ufficiale: versione bloccata, API verificate in docs/architecture.md
  "notebooklm-py==0.8.6",
  "click>=8.1,<9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Re-mint automatico della sessione da master token (vedi README, sezione sicurezza)
headless = ["notebooklm-py[headless]==0.8.6"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agency = "agency_briefing.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agency_briefing = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
